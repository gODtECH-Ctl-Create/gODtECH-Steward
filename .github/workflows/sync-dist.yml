name: Sync compiled dist

on:
  push:
    branches:
      - feat/external-rule-pack-trust

permissions:
  contents: write

jobs:
  sync-dist:
    if: ${{ !contains(github.event.head_commit.message, 'chore: sync compiled dist') && !contains(github.event.head_commit.message, 'chore: remove dist sync helper') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit compiled output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "No dist changes."
          else
            git commit -m "chore: sync compiled dist"
            git push
          fi
