<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">gODtECH Steward repository health control room</title>
  <desc id="desc">An animated dashboard showing repository health, findings, rules and safe remediation flowing through Steward.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="1110" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11131A"/>
      <stop offset="1" stop-color="#07080C"/>
    </linearGradient>
    <linearGradient id="glow" x1="180" y1="110" x2="1040" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BFFB0"/>
      <stop offset="1" stop-color="#72E7FF"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1200" height="640" rx="36" fill="url(#bg)" stroke="#252A35"/>
  <circle cx="172" cy="150" r="88" fill="#8BFFB0" opacity="0.12" filter="url(#blur)"><animate attributeName="opacity" values="0.08;0.18;0.08" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="500" r="100" fill="#72E7FF" opacity="0.08" filter="url(#blur)"><animate attributeName="opacity" values="0.05;0.13;0.05" dur="5s" repeatCount="indefinite"/></circle>
  <g opacity="0.32">
