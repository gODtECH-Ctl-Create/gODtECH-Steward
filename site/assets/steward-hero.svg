  </g>
  <g transform="translate(74 70)">
    <rect width="1052" height="68" rx="18" fill="#0B0D12" stroke="#2B313C"/>
    <circle cx="28" cy="34" r="7" fill="#FF6B6B"/><circle cx="52" cy="34" r="7" fill="#FFD166"/><circle cx="76" cy="34" r="7" fill="#8BFFB0"/>
    <text x="108" y="40" fill="#BFC6D4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">steward scan .</text>
    <text x="850" y="40" fill="#8BFFB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">DETERMINISTIC</text>
  </g>
  <g transform="translate(74 168)">
