      <text x="236" y="37" fill="#687284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">docs/decision.md</text>
      <text x="566" y="37" fill="#8BFFB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">SAFE FIX</text>
