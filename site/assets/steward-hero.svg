      <text x="178" y="37" fill="#687284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">src/rules/maintenance.ts</text>
      <text x="566" y="37" fill="#FFD166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">REVIEW</text>
