    <text x="26" y="118" fill="white" font-family="Inter, ui-sans-serif, system-ui" font-size="72" font-weight="800">88</text>
    <text x="132" y="116" fill="#8F98A8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">/100</text>
    <circle cx="165" cy="218" r="86" stroke="#242A33" stroke-width="16"/>
    <circle cx="165" cy="218" r="86" stroke="url(#glow)" stroke-width="16" stroke-linecap="round" stroke-dasharray="440 540" transform="rotate(-90 165 218)"/>
    <circle cx="165" cy="218" r="6" fill="#8BFFB0"><animate attributeName="r" values="5;8;5" dur="2.6s" repeatCount="indefinite"/></circle>
