      <circle cx="28" cy="31" r="8" fill="#72E7FF"/><text x="54" y="37" fill="#E7EBF2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">fingerprint</text>
      <text x="178" y="37" fill="#687284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">stable identity for deltas</text>
