      <rect width="456" height="26" rx="13" fill="url(#glow)"><animate attributeName="width" values="380;456;420;456" dur="4s" repeatCount="indefinite"/></rect>
      <text x="486" y="19" fill="#8F98A8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">SCAN COMPLETE</text>
